
name: "CodeQL - sigurnosna analiza"

on:
  push:
    branches: ["main", "sql-injection"]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Instalacija .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
          packs: "codeql/csharp-queries:Security Features/CWE-798"

      - name: Build
        run: |
          dotnet build VVSPrezentacija/LosKod/LosKod.csproj
          dotnet build VVSPrezentacija/IspravljenKod/IspravljenKod.csproj
          dotnet build VVSPrezentacija/SQLInjectionLosKod/SQLInjectionLosKod.csproj
          dotnet build VVSPrezentacija/SQLInjectionIspravljenKod/SQLInjectionIspravljenKod.csproj

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
