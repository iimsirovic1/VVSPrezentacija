name: "CodeQL - hardkodirane tajne"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:      # omogućava ručno pokretanje iz taba Actions

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # dozvola za upis rezultata u Security tab
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # instalira .NET 10 SDK, jer su projekti napravljeni za net10.0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual          # CodeQL prati pravi build umjesto da pogađa pakete
          queries: security-extended
          # ručno dodaje pravila iz foldera CWE-798, koja više nisu ni u jednom skupu
          packs: "codeql/csharp-queries:Security Features/CWE-798"

      - name: Build
        run: |
          dotnet build VVSPrezentacija/LosKod/LosKod.csproj
          dotnet build VVSPrezentacija/IspravljenKod/IspravljenKod.csproj

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"