
name: "SonarQube Cloud"

on:
  push:
    branches: ["main", "sql-injection"]
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalacija Jave
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Instalacija .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Instaliraj SonarScanner za .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Build i analiza
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin /k:"iimsirovic1_VVSPrezentacija" /o:"iimsirovic1" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io"

          dotnet build VVSPrezentacija/LosKod/LosKod.csproj

          dotnet build VVSPrezentacija/IspravljenKod/IspravljenKod.csproj

          dotnet build VVSPrezentacija/SQLInjectionLosKod/SQLInjectionLosKod.csproj

          dotnet build VVSPrezentacija/SQLInjectionIspravljenKod/SQLInjectionIspravljenKod.csproj

          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
